<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SIF Holdings Value</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow statement column. Combined value is the headline; each fund follows as its own ledger (units x NAV). */
:root {
  --bg: #eef2f1;
  --surface: #ffffff;
  --fg: #12211e;
  --muted: #5a6b67;
  --line: #d3dcda;
  --accent: #0b6b57;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1614; --surface: #15221f; --fg: #e6efec; --muted: #93a6a1;
    --line: #293935; --accent: #5fd0b3; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1614; --surface: #15221f; --fg: #e6efec; --muted: #93a6a1;
  --line: #293935; --accent: #5fd0b3; color-scheme: dark;
}
body {
  margin: 0;
  background: var(--bg); color: var(--fg);
  font-family: var(--font-display); font-size: 16px; line-height: 1.5;
  padding-inline: 16px; padding-block: 40px;
}
.sheet { max-width: 620px; margin-inline: auto; display: flex; flex-direction: column; gap: 32px; }
.label { font-size: 12px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
h1 { font-size: clamp(22px, 5vw, 28px); font-weight: 600; line-height: 1.2; margin: 6px 0 0; text-wrap: balance; }
.value-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 28px 24px; display: flex; flex-direction: column; gap: 6px;
}
.value {
  font-family: var(--font-data); font-weight: 500; color: var(--accent);
  font-size: clamp(30px, 9.5vw, 54px); line-height: 1.1;
  font-variant-numeric: tabular-nums; overflow-wrap: anywhere;
}
.approx { color: var(--muted); }
#funds { display: flex; flex-direction: column; gap: 32px; }
.fund { display: flex; flex-direction: column; gap: 12px; }
.fund h2 { font-size: 19px; font-weight: 600; line-height: 1.25; margin: 0; text-wrap: balance; }
.plan { color: var(--muted); margin: 2px 0 0; font-size: 14px; }
dl { margin: 0; display: flex; flex-direction: column; }
.row {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline;
  gap: 4px 16px; padding-block: 12px; border-top: 1px solid var(--line);
}
.row:last-child { border-bottom: 1px solid var(--line); }
dt { color: var(--muted); }
dd { margin: 0; font-family: var(--font-data); font-variant-numeric: tabular-nums; text-align: right; min-width: 0; overflow-wrap: anywhere; }
dd small { display: block; font-family: var(--font-display); font-size: 13px; color: var(--muted); }
.row.total dt { color: var(--fg); font-weight: 600; }
.row.total dd { color: var(--accent); font-weight: 500; font-size: 18px; }
.notes { font-size: 14px; color: var(--muted); display: flex; flex-direction: column; gap: 8px; }
.notes p { margin: 0; max-width: 65ch; }
a { color: var(--accent); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
</style>
</head>
<body>
<main class="sheet">
  <header>
    <div class="label">Holdings value</div>
    <h1>Specialized Investment Funds</h1>
  </header>

  <section class="value-card" aria-label="Total current value">
    <div class="label">Total current value</div>
    <div class="value" id="grand">—</div>
    <div class="approx" id="approx"></div>
  </section>

  <div id="funds"></div>

</main>
<script>
fetch("data.json?t=" + Date.now(), { cache: "no-store" })
  .then(function (r) { return r.json(); })
  .then(function (d) {
  var inr = function (n, dp) {
    return n.toLocaleString("en-IN", { minimumFractionDigits: dp, maximumFractionDigits: dp });
  };
  var el = function (tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  var row = function (label, value, sub, cls) {
    var r = el("div", "row" + (cls ? " " + cls : ""));
    r.appendChild(el("dt", "", label));
    var dd = el("dd", "", value);
    if (sub) dd.appendChild(el("small", "", sub));
    r.appendChild(dd);
    return r;
  };
  var funds = document.getElementById("funds");
  var grand = 0;
  d.holdings.forEach(function (h) {
    var value = Math.round(h.units * h.nav * 100) / 100;
    grand += value;
    var s = el("section", "fund");
    var head = el("div");
    if (h.amc) head.appendChild(el("div", "label", h.amc));
    head.appendChild(el("h2", "", h.name));
    head.appendChild(el("p", "plan", h.plan));
    s.appendChild(head);
    var dl = el("dl");
    dl.appendChild(row("Units held", inr(h.units, 3)));
    dl.appendChild(row("Latest NAV per unit", "₹" + inr(h.nav, 4), "as of " + h.navDate));
    dl.appendChild(row("Current value", "₹" + inr(value, 2), null, "total"));
    s.appendChild(dl);
    funds.appendChild(s);
  });
  grand = Math.round(grand * 100) / 100;
  document.getElementById("grand").textContent = "₹" + inr(grand, 2);
  var approx = grand >= 1e7 ? inr(grand / 1e7, 2) + " crore" : grand >= 1e5 ? inr(grand / 1e5, 2) + " lakh" : "";
  if (approx) document.getElementById("approx").textContent = "About ₹" + approx + " across " + d.holdings.length + " funds";
})
  .catch(function () {
    document.getElementById("grand").textContent = "Unavailable";
    document.getElementById("approx").textContent = "The holdings data could not be loaded. Please refresh the page.";
  });
</script>
</body>
</html>
