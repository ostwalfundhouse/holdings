name: Update NAV

on:
  schedule:
    # 08:49 and 12:49 IST, plus 23:44 IST after AMFI publishes the day's NAVs
    - cron: "19 3,7 * * *"
    - cron: "14 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read AMFI and update all client pages
        run: python update_nav.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "nav-updater"
            git config user.email "nav-updater@users.noreply.github.com"
            git commit -am "Update NAV"
            git push
          fi
